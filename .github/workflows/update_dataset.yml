name: Update and Compress Dataset

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download dataset
        run: |
          wget --server-response \
            --timeout=60 \
            --tries=3 \
            -O precios-historicos.csv \
            "https://datos.energia.gob.ar/dataset/1c181390-5045-475e-94dc-410429be4b17/resource/f8dda0d5-2a9f-4d34-b79b-4e63de3995df/download/precios-historicos.csv"

          test -s precios-historicos.csv

      - name: Compress dataset
        run: |
          7z a precios-historicos.7z precios-historicos.csv
          rm precios-historicos.csv

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add precios-historicos.7z

          git diff --cached --quiet || \
          git commit -m "Actualizar dataset $(date +'%Y-%m-%d')"

          git push
